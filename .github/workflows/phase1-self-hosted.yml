name: Evohome Phase 1 self-hosted validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evohome-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python contract and dashboard syntax
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Node.js for frontend validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q custom_components tests
          node --check custom_components/evohome_dashboard/frontend/dashboard.js
      - name: Execute pure-function tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Validate integration contract and permitted dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_contract.py

  pinned-evohome-api:
    name: Pinned evohome-async runtime contract
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision compatible Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install exactly pinned Resideo client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "evohome-async==3.0.0"
      - name: Verify API signatures and used methods
        shell: bash
        run: python scripts/verify_library_api.py
