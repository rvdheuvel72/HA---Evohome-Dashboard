name: Build RAMSES Arduino WROOM-32E
on:
  push:
    paths:
      - "firmware/arduino-wroom32e/**"
      - ".github/workflows/publish-ramses-arduino-v0.4-beta.yml"
      - ".github/workflows/ramses-arduino-wroom32e.yml"
  pull_request:
    paths:
      - "firmware/arduino-wroom32e/**"
      - ".github/workflows/publish-ramses-arduino-v0.4-beta.yml"
      - ".github/workflows/ramses-arduino-wroom32e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Espressif core and MQTT library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.4
          arduino-cli lib install "PubSubClient@2.8"
      - name: Provision native test compiler on self-hosted Linux
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v g++ >/dev/null 2>&1; then
            command -v apt-get >/dev/null 2>&1 || { echo "::error::apt-get and g++ unavailable"; exit 1; }
            if [ "$(id -u)" = 0 ]; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++
            elif command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++
            else
              echo "::error::g++ missing; runner has no apt privileges"
              exit 1
            fi
          fi
          g++ --version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test RAMSES receive decoder (host-native)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_codec.cpp -o /tmp/test-ramses-codec
          /tmp/test-ramses-codec
      - name: Test passive CC1101 RX health snapshots
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            firmware/arduino-wroom32e/tests/test_rx_health.cpp -o /tmp/test-ramses-rx-health
          /tmp/test-ramses-rx-health
      - name: Test bounded diagnostic event ring
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_debug.cpp -o /tmp/test-ramses-web-debug
          /tmp/test-ramses-web-debug
      - name: Test capture session, capacity and rejection export model
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_capture.cpp -o /tmp/test-ramses-capture
          /tmp/test-ramses-capture
      - name: Validate MQTT Discovery JSON against HA conventions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_discovery.cpp -o /tmp/test-ramses-discovery
          /tmp/test-ramses-discovery > /tmp/ramses-discovery.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          seen = set()
          for line in Path('/tmp/ramses-discovery.jsonl').read_text().splitlines():
              topic, payload = line.split('\t', 1)
              cfg = json.loads(payload)
              assert topic.endswith('/config')
              assert topic not in seen
              seen.add(topic)
              assert cfg['state_topic'] == 'RAMSES/GATEWAY/18:447669/status'
              assert cfg['availability_topic'] == 'RAMSES/GATEWAY/18:447669'
              assert cfg['device']['identifiers'] == ['ramses_gateway_18_447669']
              assert cfg['unique_id'].startswith('ramses_gateway_18_447669_')
          assert len(seen) == 8
          print('Validated 8 MQTT Discovery JSON payloads')
          PY
      - name: Test configurable DHCP/mDNS hostname helper
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_hostname.cpp -o /tmp/test-ramses-hostname
          /tmp/test-ramses-hostname
      - name: Test read-only OpenTherm and CC1101 frequency controls
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_opentherm.cpp -o /tmp/test-ramses-opentherm
          /tmp/test-ramses-opentherm
      - name: Test bounded R8810A 1FC9 pairing and controller read verification
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_pairing.cpp -o /tmp/test-ramses-pairing
          /tmp/test-ramses-pairing
      - name: Test strict local CC1101 TX verification
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            firmware/arduino-wroom32e/tests/test_tx_local_verification.cpp \
            -o /tmp/test-tx-local-verification
          /tmp/test-tx-local-verification
      - name: Test GPIO UART loopback fixture and byte comparison
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            firmware/arduino-wroom32e/tests/test_tx_loopback.cpp \
            -o /tmp/test-tx-loopback
          /tmp/test-tx-loopback
      - name: Test R8810A bridge-reply discovery of existing Evohome controller
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            firmware/arduino-wroom32e/tests/test_peer_detection.cpp -o /tmp/test-ramses-peer-detection
          /tmp/test-ramses-peer-detection
      - name: Test persistent gateway settings and CET/CEST timestamps
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Ifirmware/arduino-wroom32e/tests/stubs \
            firmware/arduino-wroom32e/tests/test_gateway_runtime_config.cpp \
            -o /tmp/test-ramses-runtime-settings
          /tmp/test-ramses-runtime-settings
      - name: Validate embedded gateway configuration page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('firmware/arduino-wroom32e/RamsesGateway/GatewayWebPage.h').read_text()
          assert src.count('<script>')==1 and src.count('</script>')==1
          js=src.split('<script>',1)[1].split('</script>',1)[0]
          assert 'event.preventDefault()' in js
          assert 'cfg-timezone' in js and 'X-Gateway-Config' in js
          assert "item.timestamp" in js
          Path('/tmp/gateway-page.js').write_text(js)
          PY
          node --check /tmp/gateway-page.js
      - name: Validate standalone RAMSES release version contract
        run: python3 firmware/arduino-wroom32e/tests/test_release_contract.py
      - name: Compile for ESP32-WROOM-32E
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/arduino-wroom32e/RamsesGateway --output-dir "$RUNNER_TEMP/arduino-build"
