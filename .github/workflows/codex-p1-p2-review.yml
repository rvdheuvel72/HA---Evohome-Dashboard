name: Codex P1/P2 review gate

# Protected base only. Do not run untrusted PR source or use self-hosted CPU
# until Codex has completed a CLEAN review of the exact PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Temporary safety hotfix: do not restart CI on every Codex summary edit.
  # PR synchronize still triggers exact-head review. The reviewed staged
  # controller will reintroduce authenticated late-completion handling.

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  actions: read

concurrency:
  # Ignore human/incomplete comments for cancellation purposes: separate
  # the comment event stream from the PR-synchronize controller run.
  group: evohome-codex-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  request-first-review:
    name: Request exact-head Codex pre-CI review
    outputs:
      approved: ${{ steps.preflight.outputs.approved }}
    if: >-
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
         github.event.comment.user.login == 'chatgpt-codex-connector') &&
        contains(github.event.comment.body, '"status":"completed"') &&
        contains(github.event.comment.body, '"has_any_findings":false') &&
        contains(github.event.comment.body, '"has_unresolved_findings":false')))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Request Codex once per exact SHA, if not already complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_codex_request.py pre
      - name: Non-blocking exact-head preflight (no review polling)
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from check_codex_review import check_review_only
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          pr = event.get("pull_request")
          if not pr:
              from check_codex_review import request
              number = event["issue"]["number"]
              pr = request(os.environ["GITHUB_TOKEN"],
                           f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}")
          status, reason = check_review_only(
              os.environ["GITHUB_TOKEN"], os.environ["GITHUB_REPOSITORY"],
              pr["number"], pr["head"]["sha"])
          print("Pre-CI Codex review:", status, reason)
          if status == "passed":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("approved=true\n")
          PY

  first-review:
    name: Codex BEFORE CI - no P1/P2
    needs: [request-first-review]
    if: needs.request-first-review.outputs.approved == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Require completed exact-head Codex and zero P1/P2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CODEX_EXPECTED_BLOCK_POLICY: cancel
        run: python3 scripts/check_codex_review.py --review-only

  resume-approved-ci:
    name: Resume skipped CI after late Codex completion
    needs: [first-review]
    if: >-
      needs.first-review.result == 'success' &&
      github.event_name == 'issue_comment'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Resume pre-reviewed CI without bypassing review checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/resume_after_codex.py

  await-validation:
    name: Await required build and test checks
    needs: [first-review, resume-approved-ci]
    if: >-
      always() &&
      needs.first-review.result == 'success' &&
      (github.event_name != 'issue_comment' ||
       needs.resume-approved-ci.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Await exact-head required CI after green first review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --ci-only

  request-final-review:
    name: Request second Codex review AFTER CI
    outputs:
      approved: ${{ steps.final-ready.outputs.approved }}
    needs: [await-validation]
    if: needs.await-validation.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Request fresh final review of same exact SHA after green CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_codex_request.py final
      - name: Non-blocking second-review check
        id: final-ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from check_codex_review import check_final_review, request
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          pr = event.get("pull_request")
          if not pr:
              number = event["issue"]["number"]
              pr = request(os.environ["GITHUB_TOKEN"],
                           f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}")
          status, reason = check_final_review(
              os.environ["GITHUB_TOKEN"], os.environ["GITHUB_REPOSITORY"],
              pr["number"], pr["head"]["sha"])
          print("Final Codex review:", status, reason)
          if status == "passed":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("approved=true\n")
          PY

  codex-review:
    name: Codex P1/P2 review gate
    needs: [request-final-review]
    # No failure mail for a pending external review. Only the final green
    # exact-SHA review may execute the protected merge gate.
    if: >-
      needs.request-final-review.outputs.approved == 'true' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
         github.event.comment.user.login == 'chatgpt-codex-connector') &&
        contains(github.event.comment.body, '"status":"completed"') &&
        contains(github.event.comment.body, '"has_any_findings":false') &&
        contains(github.event.comment.body, '"has_unresolved_findings":false')))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require all previous gates succeeded
        env:
          PREVIOUS_GATE: ${{ needs.request-final-review.result }}
        run: test "$PREVIOUS_GATE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify SECOND completed Codex review after CI on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --final

  auto-merge:
    name: Auto merge after clean CI and final Codex
    needs: [codex-review]
    if: needs.codex-review.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Recheck final SHA/review/CI and merge safely
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_merge_codex.py
