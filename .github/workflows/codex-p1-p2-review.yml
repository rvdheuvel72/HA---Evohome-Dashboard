name: Codex P1/P2 review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Temporary safety hotfix: do not restart CI on every Codex summary edit.
  # PR synchronize still triggers exact-head review. The reviewed staged
  # controller will reintroduce authenticated late-completion handling.

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: evohome-codex-gate-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-preflight:
    name: Initial Codex P1/P2 review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject PR sources outside this repository
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$BASE_REPO"
      - name: Load trusted verifier from protected base branch
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Require authenticated exact-head Codex review before CI
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Inline gate uses only stable helpers already present on main. PR
          # source code cannot alter it or bypass P1/P2 before the first merge.
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_codex_review import blockers, pages, request, review_ready

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          number = event['pull_request']['number']
          sha = event['pull_request']['head']['sha']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          token = os.environ['GITHUB_TOKEN']
          until = time.monotonic() + 900
          while True:
              pr = request(token, f'/repos/{repo}/pulls/{number}')
              if pr['head']['sha'] != sha or pr['state'] != 'open':
                  raise SystemExit('PR head changed or PR closed')
              findings = blockers(token, owner, name, number, sha)
              if findings:
                  raise SystemExit('Blocking Codex P1/P2: ' + '; '.join(findings[:6]))
              reviews = pages(token, f'/repos/{repo}/pulls/{number}/reviews')
              comments = pages(token, f'/repos/{repo}/issues/{number}/comments')
              if review_ready(reviews, comments, sha):
                  print('Initial exact-head Codex review passed; costly CI may start')
                  break
              if time.monotonic() + 15 >= until:
                  raise SystemExit('Initial exact-head Codex review missing; CI blocked')
              time.sleep(15)
          PY

  await-validation:
    needs: [review-preflight]
    name: Await required build and test checks
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.user.login == 'chatgpt-codex-connector'))
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Wait for exact-head CI (and Arduino compile when relevant)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/check_codex_review.py --ci-only

  codex-review:
    name: Codex P1/P2 review gate
    needs: [await-validation]
    # Always evaluate the dependency result: skipped/failed prerequisites
    # must NEVER make a branch-protection-required final gate appear green.
    if: >-
      always() &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
         github.event.comment.user.login == 'chatgpt-codex-connector')))
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Require successful build and test preflight
        env:
          BUILD_CHECK_RESULT: ${{ needs.await-validation.result }}
        shell: bash
        run: |
          if [ "$BUILD_CHECK_RESULT" != "success" ]; then
            echo "::error::Build/test validation has not passed: $BUILD_CHECK_RESULT"
            exit 1
          fi
      - name: Check out trusted base branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Confirm trusted checker exists
        shell: bash
        run: test -f scripts/check_codex_review.py
      - name: Verify exact-head Codex review, quota exception and all P1/P2 threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/check_codex_review.py
