name: Trusted RAMSES Arduino compile

# Protected-base firmware gate: PR source must not control this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'firmware/arduino-wroom32e/**'
      - '.github/workflows/ramses-arduino-wroom32e.yml'
      - '.github/workflows/trusted-ramses-compile.yml'
      - '.github/workflows/publish-ramses-arduino-v0.4-beta.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-preflight:
    name: Initial Codex P1/P2 review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject PR sources outside this repository
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$BASE_REPO"
      - name: Load trusted verifier from protected base branch
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Require authenticated exact-head Codex review before CI
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Inline gate uses only stable helpers already present on main. PR
          # source code cannot alter it or bypass P1/P2 before the first merge.
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_codex_review import blockers, pages, request, review_ready

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          number = event['pull_request']['number']
          sha = event['pull_request']['head']['sha']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          token = os.environ['GITHUB_TOKEN']
          until = time.monotonic() + 900
          while True:
              pr = request(token, f'/repos/{repo}/pulls/{number}')
              if pr['head']['sha'] != sha or pr['state'] != 'open':
                  raise SystemExit('PR head changed or PR closed')
              findings = blockers(token, owner, name, number, sha)
              if findings:
                  raise SystemExit('Blocking Codex P1/P2: ' + '; '.join(findings[:6]))
              reviews = pages(token, f'/repos/{repo}/pulls/{number}/reviews')
              comments = pages(token, f'/repos/{repo}/issues/{number}/comments')
              if review_ready(reviews, comments, sha):
                  print('Initial exact-head Codex review passed; costly CI may start')
                  break
              if time.monotonic() + 15 >= until:
                  raise SystemExit('Initial exact-head Codex review missing; CI blocked')
              time.sleep(15)
          PY

  verified-arduino:
    needs: [review-preflight]
    name: Trusted Arduino compile
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    # No secrets, writes or persistent credentials. Only trusted project branches should run on self-hosted hardware.
    steps:
      - name: Checkout exact PR source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      - name: Validate exact checked-out head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -f firmware/arduino-wroom32e/RamsesGateway/GatewaySecrets.h
      - name: Isolate Arduino configuration per job
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ARDUINO_CONFIG_FILE=$RUNNER_TEMP/arduino-cli.yaml"
            echo "ARDUINO_DIRECTORIES_DATA=$RUNNER_TEMP/arduino-data"
            echo "ARDUINO_DIRECTORIES_USER=$RUNNER_TEMP/arduino-sketchbook"
            echo "ARDUINO_DIRECTORIES_DOWNLOADS=$RUNNER_TEMP/arduino-downloads"
          } >> "$GITHUB_ENV"
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 board core and PubSubClient
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --dest-file "$ARDUINO_CONFIG_FILE" --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "PubSubClient@2.8"
      - name: Compile actual PR firmware for ESP32-WROOM-32E
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
            firmware/arduino-wroom32e/RamsesGateway \
            --output-dir "$RUNNER_TEMP/trusted-arduino"
          test -n "$(find "$RUNNER_TEMP/trusted-arduino" -maxdepth 1 -name '*.bin' -print -quit)"
