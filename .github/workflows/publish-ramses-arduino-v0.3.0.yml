name: Publish RAMSES Arduino Gateway v0.3.0
# Superseded release workflow: manual maintenance only, never on firmware PRs.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read
  issues: read

concurrency:
  group: publish-ramses-arduino-v0.3.0
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish dedicated Arduino release
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the RAMSES decoder before packaging
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer firmware/arduino-wroom32e/tests/test_codec.cpp \
            -o /tmp/test-ramses-arduino
          /tmp/test-ramses-arduino

      - name: Test web diagnostic log buffer
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer firmware/arduino-wroom32e/tests/test_debug.cpp \
            -o /tmp/test-gateway-web
          /tmp/test-gateway-web

      - name: Test Home Assistant Discovery JSON
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer firmware/arduino-wroom32e/tests/test_discovery.cpp \
            -o /tmp/test-ramses-ha-discovery
          /tmp/test-ramses-ha-discovery > /tmp/ramses-ha-discovery.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('/tmp/ramses-ha-discovery.jsonl').read_text().splitlines()
          assert len(lines) == 8
          for line in lines:
              topic, payload = line.split('\t', 1)
              config = json.loads(payload)
              assert topic.endswith('/config')
              assert config['state_topic'] == 'RAMSES/GATEWAY/18:447669/status'
              assert config['device']['identifiers'] == ['ramses_gateway_18_447669']
          print('Home Assistant Discovery: 8 JSON configs verified')
          PY

      - name: Build clean Arduino IDE source ZIP with SHA256
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib

          src = Path("firmware/arduino-wroom32e")
          sketch = src / "RamsesGateway"
          required = [
              "RamsesGateway.ino",
              "Cc1101Radio.h",
              "RamsesCodec.h",
              "GatewaySecrets.example.h",
              "GatewayDebug.h",
              "GatewayWebPage.h",
              "GatewayDiscovery.h",
          ]
          for file in required:
              assert (sketch / file).is_file(), f"Missing sketch source: {file}"
          assert not (sketch / "GatewaySecrets.h").exists(), "Refusing to release real Wi-Fi credentials"
          assert (src / "README.md").is_file()
          assert Path("LICENSE").is_file()

          out = Path("dist")
          out.mkdir(exist_ok=True)
          zip_path = out / "RAMSES-Arduino-Gateway-v0.3.0-ESP32-WROOM-32E.zip"
          with ZipFile(zip_path, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in required:
                  archive.write(sketch / name, f"RamsesGateway/{name}")
              archive.write(src / "README.md", "README.md")
              archive.write("LICENSE", "LICENSE")

          with ZipFile(zip_path) as archive:
              actual = set(archive.namelist())
              expected = {f"RamsesGateway/{x}" for x in required} | {"README.md", "LICENSE"}
              assert actual == expected, f"Unexpected archive contents: {actual ^ expected}"
              assert archive.testzip() is None, "ZIP integrity check failed"

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          checksum = out / f"{zip_path.name}.sha256"
          checksum.write_text(f"{digest}  {zip_path.name}\n")
          print(f"Created: {zip_path} ({zip_path.stat().st_size} bytes)")
          print(f"SHA256: {digest}")
          PY

      - name: Publish separate Arduino prerelease and downloadable ZIP
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="ramses-arduino-v0.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Skipping publication; nothing overwritten."
          else
            # Mandatory exact-source review check; never publish on CI alone.
            python3 scripts/check_release_readiness.py
            if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Release tag ${TAG} already exists. Bump version instead of reusing a stale tag."
              exit 1
            fi
            gh release create "$TAG" \
              dist/RAMSES-Arduino-Gateway-v0.3.0-ESP32-WROOM-32E.zip \
              dist/RAMSES-Arduino-Gateway-v0.3.0-ESP32-WROOM-32E.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "RAMSES Arduino Gateway v0.3.0 (ESP32-WROOM-32E)" \
              --notes-file firmware/arduino-wroom32e/RELEASE_NOTES_v0.3.0.md \
              --prerelease
          fi

      - name: Show publication time in Netherlands (CET/CEST)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release_local_time.py --tag ramses-arduino-v0.3.0

      - name: Verify GitHub release and ZIP asset exist
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view ramses-arduino-v0.3.0 --json url,assets,isPrerelease \
            --jq '{url, prerelease: .isPrerelease, assets: [.assets[].name]}'
          gh release view ramses-arduino-v0.3.0 --json assets \
            --jq '.assets[].name' | grep -Fx 'RAMSES-Arduino-Gateway-v0.3.0-ESP32-WROOM-32E.zip'
