name: Evohome Phase 1 self-hosted validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evohome-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python contract and dashboard syntax
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q custom_components tests
          node --check custom_components/evohome_dashboard/frontend/dashboard.js
      - name: Execute pure-function tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Validate integration contract and permitted dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_contract.py
