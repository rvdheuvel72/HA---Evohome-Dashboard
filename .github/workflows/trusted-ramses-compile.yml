name: Trusted RAMSES Arduino compile

# Protected-base firmware gate: PR source must not control this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'firmware/arduino-wroom32e/**'
      - '.github/workflows/ramses-arduino-wroom32e.yml'
      - '.github/workflows/trusted-ramses-compile.yml'
      - '.github/workflows/publish-ramses-arduino-v0.4-beta.yml'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-preflight:
    name: Initial Codex P1/P2 review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse external PR branches for authenticated review
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$BASE_REPO"
      - name: Checkout PR source for read-only review verifier
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require completed exact-head Codex review before self-hosted jobs
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --review-only

  verified-arduino:
    needs: [review-preflight]
    name: Trusted Arduino compile
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    # No secrets, writes or persistent credentials. Only trusted project branches should run on self-hosted hardware.
    steps:
      - name: Checkout exact PR source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
      - name: Validate exact checked-out head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -f firmware/arduino-wroom32e/RamsesGateway/GatewaySecrets.h
      - name: Isolate Arduino configuration per job
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ARDUINO_CONFIG_FILE=$RUNNER_TEMP/arduino-cli.yaml"
            echo "ARDUINO_DIRECTORIES_DATA=$RUNNER_TEMP/arduino-data"
            echo "ARDUINO_DIRECTORIES_USER=$RUNNER_TEMP/arduino-sketchbook"
            echo "ARDUINO_DIRECTORIES_DOWNLOADS=$RUNNER_TEMP/arduino-downloads"
          } >> "$GITHUB_ENV"
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 board core and PubSubClient
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --dest-file "$ARDUINO_CONFIG_FILE" --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install "PubSubClient@2.8"
      - name: Compile actual PR firmware for ESP32-WROOM-32E
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
            firmware/arduino-wroom32e/RamsesGateway \
            --output-dir "$RUNNER_TEMP/trusted-arduino"
          test -n "$(find "$RUNNER_TEMP/trusted-arduino" -maxdepth 1 -name '*.bin' -print -quit)"
