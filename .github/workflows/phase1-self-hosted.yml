name: Evohome Phase 1 self-hosted validation

on:
  pull_request:
    branches: [main]
    paths: &ha_paths
      - 'custom_components/**'
      - 'frontend-package/**'
      - 'tests/**'
      - 'tests_integration/**'
      - 'scripts/**'
      - 'hacs.json'
      - 'manifest.json'
      - '.github/workflows/phase1-self-hosted.yml'
  push:
    branches: [main]
    paths: *ha_paths
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: evohome-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-before-ci:
    name: Codex BEFORE CI - Home Assistant
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - name: Checkout protected main review script only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Wait for green exact-head Codex P1/P2 review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --review-only

  verify:
    name: Python contract and dashboard syntax
    needs: [review-before-ci]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.review-before-ci.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Node.js for frontend validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q custom_components tests
          node --check custom_components/evohome_dashboard/frontend/dashboard.js
          node --check custom_components/evohome_dashboard/frontend/dashboard-legacy.js
          node --check frontend-package/dist/evohome-dashboard-ui.js
      - name: Execute pure-function tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Validate integration contract and permitted dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_contract.py
          python3 scripts/package_frontend.py --output build/evohome-dashboard-ui.zip

  standalone-frontend-bundle:
    name: Independent HACS frontend package
    needs: [review-before-ci]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.review-before-ci.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate JavaScript and make frontend-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_frontend.py --output build/evohome-dashboard-ui.zip
          node --check frontend-package/dist/evohome-dashboard-ui.js
          python3 -m unittest discover -s tests -p test_frontend_split.py -v
      - name: Publish deployable HACS frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: evohome-dashboard-ui-hacs
          path: build/evohome-dashboard-ui.zip
          if-no-files-found: error

  pinned-evohome-api:
    name: Pinned evohome-async runtime contract
    needs: [review-before-ci]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.review-before-ci.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision compatible Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Isolate Python dependencies on persistent runners
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/evohome-pinned-venv"
          echo "$RUNNER_TEMP/evohome-pinned-venv/bin" >> "$GITHUB_PATH"
      - name: Install exactly pinned Resideo client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "evohome-async==2.1.0"
      - name: Verify API signatures, common exceptions package and used methods
        shell: bash
        run: |
          python scripts/verify_library_api.py
          python - <<'PY'
          from importlib.metadata import version
          from _evohome.exceptions import EvohomeError
          import evohomeasync2
          assert version("evohome-async") == "2.1.0"
          assert EvohomeError is not None
          print("HA 2026.10 pinned Evohome and _evohome import PASS")
          PY

  ha-runtime-import:
    name: Home Assistant 2026.10 runtime imports
    needs: [review-before-ci]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.review-before-ci.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Isolate Python dependencies on persistent runners
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/evohome-ha-runtime-venv"
          echo "$RUNNER_TEMP/evohome-ha-runtime-venv/bin" >> "$GITHUB_PATH"
      - name: Install Home Assistant and exact transport
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "homeassistant>=2026.10,<2026.11" "evohome-async==2.1.0"
      - name: Import every native HA platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import import_module
          from custom_components.evohome_dashboard import PLATFORMS
          expected = {"climate", "sensor", "binary_sensor", "select", "switch", "button"}
          assert set(PLATFORMS) == expected, PLATFORMS
          for platform in PLATFORMS:
              mod = import_module("custom_components.evohome_dashboard." + platform)
              assert callable(mod.async_setup_entry), platform
          print("Native Home Assistant platform imports passed:", sorted(PLATFORMS))
          PY
          python -m unittest discover -s tests_integration -v
