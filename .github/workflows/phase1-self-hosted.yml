name: Evohome Phase 1 self-hosted validation

on:
  pull_request:
    branches: [main]
    paths: &ha_paths
      - 'custom_components/**'
      - 'frontend-package/**'
      - 'tests/**'
      - 'tests_integration/**'
      - 'scripts/**'
      - 'hacs.json'
      - 'manifest.json'
      - '.github/workflows/phase1-self-hosted.yml'
      - '.github/workflows/publish-evohome-hacs.yml'
      - 'docs/HA_CHANGELOG.md'
  push:
    branches: [main]
    paths: *ha_paths
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: evohome-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-preflight:
    name: Initial Codex P1/P2 review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject PR sources outside this repository
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: test "$HEAD_REPO" = "$BASE_REPO"
      - name: Load trusted verifier from protected base branch
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Require authenticated exact-head Codex review before CI
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Inline gate uses only stable helpers already present on main. PR
          # source code cannot alter it or bypass P1/P2 before the first merge.
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_codex_review import blockers, pages, request, review_ready

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          number = event['pull_request']['number']
          sha = event['pull_request']['head']['sha']
          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          token = os.environ['GITHUB_TOKEN']
          until = time.monotonic() + 900
          while True:
              pr = request(token, f'/repos/{repo}/pulls/{number}')
              if pr['head']['sha'] != sha or pr['state'] != 'open':
                  raise SystemExit('PR head changed or PR closed')
              findings = blockers(token, owner, name, number, sha)
              if findings:
                  raise SystemExit('Blocking Codex P1/P2: ' + '; '.join(findings[:6]))
              reviews = pages(token, f'/repos/{repo}/pulls/{number}/reviews')
              comments = pages(token, f'/repos/{repo}/issues/{number}/comments')
              if review_ready(reviews, comments, sha):
                  print('Initial exact-head Codex review passed; costly CI may start')
                  break
              if time.monotonic() + 15 >= until:
                  raise SystemExit('Initial exact-head Codex review missing; CI blocked')
              time.sleep(15)
          PY

  verify:
    needs: [review-preflight]
    name: Python contract and dashboard syntax
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Node.js for frontend validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require HA integration version bump for runtime changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/check_ha_version.py --base-sha "$BASE_SHA"
      - name: Check source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q custom_components tests
          node --check custom_components/evohome_dashboard/frontend/dashboard.js
          node --check custom_components/evohome_dashboard/frontend/dashboard-legacy.js
          node --check frontend-package/dist/evohome-dashboard-ui.js
          node tests/test_ui_fallback_preloaded.js
      - name: Execute pure-function tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Validate integration contract and permitted dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_contract.py
          python3 scripts/package_frontend.py --output build/evohome-dashboard-ui.zip

  standalone-frontend-bundle:
    needs: [review-preflight]
    name: Independent HACS frontend package
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate JavaScript and make frontend-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_frontend.py --output build/evohome-dashboard-ui.zip
          node --check frontend-package/dist/evohome-dashboard-ui.js
          python3 -m unittest discover -s tests -p test_frontend_split.py -v
      - name: Publish deployable HACS frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: evohome-dashboard-ui-hacs
          path: build/evohome-dashboard-ui.zip
          if-no-files-found: error

  pinned-evohome-api:
    needs: [review-preflight]
    name: Pinned evohome-async runtime contract
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision compatible Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Isolate Python dependencies on persistent runners
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/evohome-pinned-venv"
          echo "$RUNNER_TEMP/evohome-pinned-venv/bin" >> "$GITHUB_PATH"
      - name: Install exactly pinned Resideo client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "evohome-async==2.1.0"
      - name: Verify API signatures, common exceptions package and used methods
        shell: bash
        run: |
          python scripts/verify_library_api.py
          python - <<'PY'
          from importlib.metadata import version
          from _evohome.exceptions import EvohomeError
          import evohomeasync2
          assert version("evohome-async") == "2.1.0"
          assert EvohomeError is not None
          print("HA 2026.10 pinned Evohome and _evohome import PASS")
          PY

  ha-runtime-import:
    needs: [review-preflight]
    name: Home Assistant 2026.10 runtime imports
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Isolate Python dependencies on persistent runners
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/evohome-ha-runtime-venv"
          echo "$RUNNER_TEMP/evohome-ha-runtime-venv/bin" >> "$GITHUB_PATH"
      - name: Install Home Assistant and exact transport
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "homeassistant>=2026.10,<2026.11" "evohome-async==2.1.0"
      - name: Import every native HA platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib import import_module
          from custom_components.evohome_dashboard import PLATFORMS
          expected = {"climate", "sensor", "binary_sensor", "select", "switch", "button"}
          assert set(PLATFORMS) == expected, PLATFORMS
          for platform in PLATFORMS:
              mod = import_module("custom_components.evohome_dashboard." + platform)
              assert callable(mod.async_setup_entry), platform
          print("Native Home Assistant platform imports passed:", sorted(PLATFORMS))
          PY
          python -m unittest discover -s tests_integration -v
