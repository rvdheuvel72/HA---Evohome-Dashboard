name: Codex P1/P2 review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: evohome-codex-gate-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Codex P1/P2 review gate
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    # Privileged review check never shares persistent runners with PR-controlled tests.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify Codex review and all unresolved P1/P2 threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/check_codex_review.py
