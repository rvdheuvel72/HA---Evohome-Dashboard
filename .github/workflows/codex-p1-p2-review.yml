name: Codex P1/P2 review gate

# Protected base only. Do not run untrusted PR source or use self-hosted CPU
# until Codex has completed a CLEAN review of the exact PR head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: evohome-codex-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-first-review:
    name: Request exact-head Codex pre-CI review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Request Codex once per exact SHA, if not already complete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_codex_request.py pre

  first-review:
    name: Codex BEFORE CI - no P1/P2
    needs: [request-first-review]
    if: needs.request-first-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Require completed exact-head Codex and zero P1/P2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --review-only

  await-validation:
    name: Await required build and test checks
    needs: [first-review]
    if: needs.first-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Await exact-head required CI after green first review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --ci-only

  request-final-review:
    name: Request second Codex review AFTER CI
    needs: [await-validation]
    if: needs.await-validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Request fresh final review of same exact SHA after green CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_codex_request.py final

  codex-review:
    name: Codex P1/P2 review gate
    needs: [request-final-review]
    # The branch-protection check must never be green after a skipped stage.
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - name: Require all previous gates succeeded
        env:
          PREVIOUS_GATE: ${{ needs.request-final-review.result }}
        run: test "$PREVIOUS_GATE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify SECOND completed Codex review after CI on exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codex_review.py --final

  auto-merge:
    name: Auto merge after clean CI and final Codex
    needs: [codex-review]
    if: needs.codex-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Recheck final SHA/review/CI and merge safely
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/auto_merge_codex.py
